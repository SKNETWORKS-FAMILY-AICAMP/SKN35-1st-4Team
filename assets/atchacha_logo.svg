<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 52" width="196" height="52" role="img" aria-label="앗차차">
  <defs>
    <linearGradient id="lg-body" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#FFA45C"/>
      <stop offset="45%" stop-color="#E4551D"/>
      <stop offset="100%" stop-color="#A93409"/>
    </linearGradient>
    <linearGradient id="lg-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lg-word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A2B0B"/>
      <stop offset="100%" stop-color="#D14314"/>
    </linearGradient>
  </defs>

  <!-- 마크: 여백을 최대한 줄여 작게 표시돼도 크게 보이게 -->
  <g transform="translate(2 2)">
    <rect x="0" y="0" width="48" height="48" rx="14.5" fill="url(#lg-body)"/>
    <rect x="0" y="0" width="48" height="48" rx="14.5" fill="none"
          stroke="#FFD3B8" stroke-opacity=".6" stroke-width="1.4"/>
    <path d="M0 15C0 6.7 6.7 0 15 0h18c8.3 0 15 6.7 15 15v2.5C40.3 22.6 31 25 24 25S7.7 22.6 0 17.5z"
          fill="url(#lg-gloss)"/>
    <rect x="20.4" y="10" width="7.2" height="19" rx="3.6" fill="#fff"/>
    <circle cx="24" cy="37" r="4.2" fill="#fff"/>
  </g>

  <!-- 워드마크 -->
  <text x="60" y="36"
        font-family="Pretendard, -apple-system, 'Malgun Gothic', sans-serif"
        font-size="30" font-weight="800" fill="url(#lg-word)" letter-spacing="-1">앗차차!</text>
</svg>
