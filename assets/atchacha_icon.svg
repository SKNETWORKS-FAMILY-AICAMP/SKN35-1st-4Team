<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="앗차차">
  <defs>
    <linearGradient id="ic-body" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#FFA45C"/>
      <stop offset="45%" stop-color="#E4551D"/>
      <stop offset="100%" stop-color="#A93409"/>
    </linearGradient>
    <linearGradient id="ic-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="ic-shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.2" stdDeviation="2.4" flood-color="#7A2408" flood-opacity=".40"/>
    </filter>
  </defs>

  <!-- 둥근 사각 배지: 원보다 앱 아이콘처럼 보이고 작게 줄여도 형태가 남는다 -->
  <rect x="4" y="4" width="56" height="56" rx="17" fill="url(#ic-body)" filter="url(#ic-shadow)"/>
  <rect x="4" y="4" width="56" height="56" rx="17" fill="none"
        stroke="#FFD3B8" stroke-opacity=".55" stroke-width="1.6"/>
  <!-- 위쪽 유광 하이라이트 -->
  <path d="M4 21c0-9.4 7.6-17 17-17h22c9.4 0 17 7.6 17 17v3c-9 6-19.6 9-28 9S13 30 4 24z"
        fill="url(#ic-gloss)"/>

  <!-- 느낌표: '앗!' 하고 알아채는 순간 -->
  <rect x="27.6" y="16" width="8.8" height="23" rx="4.4" fill="#fff"/>
  <circle cx="32" cy="46.6" r="5.1" fill="#fff"/>
</svg>
